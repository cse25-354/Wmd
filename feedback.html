<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Holy Jack Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="feedback">
    <header>
        <p>Holy Jack Studio</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="about.html">About</a>
            <a href="payment.html">Payment</a>
            <a href="feedback.html">Feedback</a>
        </nav>
    </header>

        <main class="feedback-page">
    <form class="feedback-box">
        <p>Rate your experience with us</p>
        
        <!-- Star Rating Group -->
        <section class="star-rating">
            <input type="radio" name="rate" id="star5" value="5">
            <label for="star5">★</label>
            <input type="radio" name="rate" id="star4" value="4">
            <label for="star4">★</label>
            <input type="radio" name="rate" id="star3" value="3">
            <label for="star3">★</label>
            <input type="radio" name="rate" id="star2" value="2">
            <label for="star2">★</label>
            <input type="radio" name="rate" id="star1" value="1">
            <label for="star1">★</label>
        </section>

        <section class="comment-section">
            <label for="comment">Comment:</label>
            <textarea id="comment" placeholder="____________________&#10;____________________"></textarea>
        </section>

        <button type="submit" class="submit-btn">Submit</button>
    </form>
</main>

    <footer>
        <p>© 2026 All rights reserved</p>
    </footer>
</body>
</html>
