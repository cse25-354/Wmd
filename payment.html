<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | Holy Jack Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="payment">
    <header>
        <p>Holy Jack Studio</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="about.html">About</a>
            <a href="payment.html" class="active">Payment</a>
            <a href="feedback.html">Feedback</a>
        </nav>
    </header>
    
        <main class="payment-page">
    <section class="payment-box">
        <h2>Payment</h2>
        <p class="payment-divider">___________________________</p>
        <p style="margin-bottom: 20px;">Please enter card details below:</p>
        
        <form action="#">
            <!-- Cardholder Name -->
            <p class="form-group">
                <label Safe For="card-name">Name:</label>
                <input type="text" id="card-name" required>
            </p>

            <!-- Card Number -->
            <p class="form-group">
                <label Safe For="card-num">Card:</label>
                <input type="text" id="card-num" placeholder="0000 0000 0000 0000" required>
            </p>

            <!-- Expiry Date (Inline Group) -->
            <p class="form-group inline-group">
                <label Safe For="expiry">Exp:</label>
                <input type="text" id="expiry" placeholder="MM/YY" required>
            </p>

            <!-- CVV (Inline Group) -->
            <p class="form-group inline-group">
                <label Safe For="cvv">CVV:</label>
                <input type="password" id="cvv" placeholder="123" required>
            </p>

            <!-- Action Button -->
            <p class="payment-buttons">
                <button type="submit" class="pay-now-btn">Pay Now</button>
            </p>
        </form>
    </section>

    </main>
    <footer>
        <p>© 2026 All rights reserved</p>
    </footer>
</body>
</html>
